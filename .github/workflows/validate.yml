name: Validar GerenciadorAulas
on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - run: dotnet test tests/GerenciadorAulas.Tests --configuration Release --logger trx
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - run: dotnet workload install maui-windows --version 10.0.100
      - run: dotnet build src/GerenciadorAulas.App -f net10.0-windows10.0.19041.0 -p:BuildWindowsOnly=true -c Release -r win-x64
